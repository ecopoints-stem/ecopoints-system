version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecopoints-api
    image: ecopoints-api:1.0
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - ecopointsdb
    networks:
      - ecopoints-network

  ecopointsdb:
    image: postgres:14
    container_name: ecopoints-db
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ecopoints-postgres-data:/var/lib/postgresql/data
    networks:
      - ecopoints-network

volumes:
  ecopoints-postgres-data:
    driver: local

networks:
  ecopoints-network:
    driver: bridge
